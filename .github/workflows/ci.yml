name: CI

# The repository's canonical contributor gates, run on GitHub Actions. Each
# step is a `scripts/gate.py` arm, so the workflow and the local `make`
# targets run one definition of every command:
#   `ci`              — lint, format, types, pipeline (`scripts/run_all.py`:
#                       Lean boundary build + hygiene budget, artifact
#                       generation, manuscript validation, regression gate
#                       against scripts/regression_baseline.json). One job, so
#                       every gate shares the generated-artifact tree and a
#                       failure in any of them fails the same run.
#   `gnn-conformance` — the pinned upstream GNN parser arm.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: "Pipeline gates, lint, and Lean budget"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pipeline's first stage is `scripts/build_lean.py`, which runs
      # `lake build` and the sorry/axiom/unsafe budget gate. The toolchain is
      # pinned by lean/lean-toolchain; elan installs with no default toolchain
      # and resolves that pin on first use.
      - name: Install the pinned Lean toolchain (elan)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true

      # The `sim` group installs the pinned `inferactively-pymdp` release (see
      # pyproject.toml); the suite and the pymdp-backed generators require it
      # (tests/AGENTS.md, pyproject.toml [tool.coverage.report]). `uv sync` also
      # installs the default groups (`dev`, `viz`, `lint`), which carry pytest,
      # Ruff and Mypy.
      - name: Sync dependencies
        run: uv sync --frozen --group sim

      # Every later step passes `--no-sync` so they run against exactly the
      # environment synced above: a re-syncing `uv sync`/`uv run` resolves the
      # default groups (`dev`, `viz`, `lint`), which do not include `sim`. With
      # pymdp pruned, the `requires_pymdp` tests skip instead of running and the
      # aggregate coverage measures ~88.8% against the recorded floor, so the
      # regression gate would fail for an environment reason rather than a code
      # one. (`uv sync` without `--group sim` was observed to remove pymdp on
      # 2026-11-02; `uv run` did not remove it — `--no-sync` makes the step order
      # safe either way.)
      #
      # Every step delegates to `scripts/gate.py`, the single definition of each
      # gate arm; the local equivalents are `make lint format types pipeline`.
      # Cheap arms run first so a lint or type failure does not wait behind the
      # artifact tree.
      #
      # The pipeline arm runs `scripts/run_all.py` in canonical order (Lean
      # budget, figure/simulation generation, manuscript variables and
      # validators, then the regression gate: pytest + coverage against
      # scripts/regression_baseline.json, this project's acceptance mechanism
      # for the declared >=95% floor). The `slow`-marked release probes (the
      # MathlibProofs axiom audit, the Lean toolchain build) are opt-in through
      # `python scripts/gate.py slow`, not part of the push/PR selection.
      - name: Lint (Ruff)
        run: uv run --no-sync python scripts/gate.py lint

      - name: Format check (Ruff)
        run: uv run --no-sync python scripts/gate.py format

      - name: Type check (Mypy)
        run: uv run --no-sync python scripts/gate.py types

      - name: Pipeline (Lean budget, artifacts, validation, regression gate)
        run: uv run --no-sync python scripts/gate.py pipeline

  # The project-owned parser is cited-not-vendored; this job exercises it
  # against the real upstream parser of the revision pinned in gnn/upstream.json.
  # The ordinary `ci` job runs the same test without an explicit checkout, so it
  # skips; setting the checkout here makes an unavailable or divergent pin fail
  # the named conformance job instead.
  #
  # `scripts/gate.py gnn` is the same arm a contributor runs locally
  # (`make gnn`): it fetches the pinned commit, refuses a moved tag, gives the
  # checkout an interpreter with the parser's dependencies, and runs
  # tests/test_gnn_upstream_conformance.py. The checkout lives outside the
  # repository (per-pin cache directory, or $POLICY_ENTANGLEMENT_GNN_ROOT).
  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true

      # The conformance test needs numpy + the project's own `gnn` package; the
      # pymdp `sim` group (JAX et al.) is not part of this arm, so the default
      # groups are enough and the job stops paying for a second heavy install.
      - name: Sync dependencies
        run: uv sync --frozen

      - name: Pinned GNN parser conformance
        run: uv run --no-sync python scripts/gate.py gnn
